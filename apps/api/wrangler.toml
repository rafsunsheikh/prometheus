name = "prometheus-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static vars (non-secret). Secrets go via `wrangler secret put`.
[vars]
# NOTE: ALLOWED_EMAILS is a SECRET, not a var — it holds real email addresses
# and this file is public. Set it with:
#   echo 'you@example.com|you.alt@example.com' | npx wrangler secret put ALLOWED_EMAILS
#   ","  separates different PEOPLE — each gets their own private library.
#   "|"  joins addresses belonging to the SAME person; the first is the
#        identity their books are filed under, the rest are aliases for it.
# Forgetting a "|" gives separate libraries, never shared ones.
# Origins allowed to call this API (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://rafsunsheikh.github.io,http://localhost:5173"
# Google OAuth Web client ID (public value — safe to commit).
GOOGLE_CLIENT_ID = ""

[[d1_databases]]
binding = "DB"
database_name = "prometheus-db"
database_id = "339194bb-6a8a-4656-b7c2-86e36887ad51"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "prometheus-library"

[observability]
enabled = true
