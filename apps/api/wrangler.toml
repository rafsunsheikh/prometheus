name = "prometheus-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Static vars (non-secret). Secrets go via `wrangler secret put`.
[vars]
# Who may sign in.
#   ","  separates different PEOPLE — each gets their own private library.
#   "|"  joins addresses belonging to the SAME person; the first one is the
#        identity their books are filed under, the rest are aliases for it.
# So "you@example.com|you.alt@example.com, friend@example.com" is two people, one of whom
# has two addresses. Forgetting a "|" gives separate libraries, never shared
# ones. Edit and redeploy to change; it takes effect on the next request.
# Origins allowed to call this API (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://rafsunsheikh.github.io,http://localhost:5173"
# Google OAuth Web client ID (public value — safe to commit).
GOOGLE_CLIENT_ID = ""

[[d1_databases]]
binding = "DB"
database_name = "prometheus-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "prometheus-library"

[observability]
enabled = true
