name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it; Pages deploys are not resumable.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        working-directory: apps/web
        env:
          # Public values: they are compiled into the bundle by design.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: |
          if [ -z "$VITE_API_URL" ] || [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "::error::Set the VITE_API_URL and VITE_GOOGLE_CLIENT_ID repository variables"
            echo "::error::(Settings → Secrets and variables → Actions → Variables) before deploying."
            exit 1
          fi
          npm run build

      - name: Add SPA 404 fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
